[versions]
kotlin = "2.2.21"
fabric-loom = "1.11-SNAPSHOT"
iridium = "3.5.0"
# Dependencies
fzzy-config = "0.7.6+1.21"
farmers-delight = "1.21.1-3.2.2+refabricated"
# Compat Dependencies
dusks-and-dungeons = "1.0.0-beta.3-no_biome"
white-pumpkins = "aAabTuRk"
# Recipe Viewer Compat
emi = "1.1.22+1.21.1"
jei = "19.27.0.340"
rei = "16.0.754"
# QoL
modmenu = "11.0.3"
appleskin = "mc1.21-3.0.5"
clothconfig = "15.0.127"
# Testing
creative-works = "0.5.0"
imguimc = "1.21.1-1.0.8"

[libraries]
# Dependencies
fzzy-config = { module = "me.fzzyhmstrs:fzzy_config", version.ref = "fzzy-config" }
farmers-delight = { module = "vectorwing:FarmersDelight", version.ref = "farmers-delight" }
# Compat Dependencies
white-pumpkins = { module = "maven.modrinth:white-pumpkins", version.ref = "white-pumpkins" }
dusks-and-dungeons = { module = "org.teamvoided:dusks_and_dungeons", version.ref = "dusks-and-dungeons" }
# Recipe Viewer Compat
emi = { module = "dev.emi:emi-fabric", version.ref = "emi" }
#noinspection UnusedVersionCatalogEntry
jei = { module = "mezz.jei:jei-1.21.1-fabric", version.ref = "jei" }
jei-api = { module = "mezz.jei:jei-1.21.1-fabric-api", version.ref = "jei" }
basic-math = { module = "me.shedaniel.cloth:basic-math", version = "0.6.1" }
architectury = { module = "dev.architectury:architectury-fabric", version = "13.0.8" }
rei-api = { module = "me.shedaniel:RoughlyEnoughItems-api-fabric", version.ref = "rei" }
rei-defualt = { module = "me.shedaniel:RoughlyEnoughItems-default-plugin-fabric", version.ref = "rei" }
#noinspection UnusedVersionCatalogEntry
rei = { module = "me.shedaniel:RoughlyEnoughItems-fabric", version.ref = "rei" }
# QoL
modmenu = { module = "com.terraformersmc:modmenu", version.ref = "modmenu" }
appleskin = { module = "squeek.appleskin:appleskin-fabric", version.ref = "appleskin" }
clothconfig = { module = "me.shedaniel.cloth:cloth-config-fabric", version.ref = "clothconfig" }
# Testing
creative-works = { module = "org.teamvoided:creative_works", version.ref = "creative-works" }
imguimc = { module = "maven.modrinth:imgui-mc", version.ref = "imguimc" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlinx-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
fabric-loom = { id = "fabric-loom", version.ref = "fabric-loom" }
iridium = { id = "org.teamvoided.iridium", version.ref = "iridium" }
iridium-publish = { id = "iridium.project.publish-script", version.ref = "iridium" }
iridium-upload = { id = "iridium.mod.upload-script", version.ref = "iridium" }
